<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="'IBM Plex Sans', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="225" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Traditional Algorithm</text>
  <text x="675" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Edge AI Model</text>

  <!-- Divider -->
  <line x1="450" y1="20" x2="450" y2="440" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- === Traditional column === -->
  <!-- Sensor -->
  <rect x="115" y="70" width="220" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="225" y="104" text-anchor="middle" font-size="15" fill="#334155">Sensor Reading</text>

  <line x1="225" y1="126" x2="225" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Threshold -->
  <rect x="105" y="170" width="240" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="225" y="197" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">Fixed Threshold</text>
  <text x="225" y="217" text-anchor="middle" font-size="13" fill="#92400e" font-family="'IBM Plex Mono', monospace">if (value &gt; limit)</text>

  <line x1="225" y1="234" x2="225" y2="274" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action -->
  <rect x="115" y="278" width="220" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="225" y="312" text-anchor="middle" font-size="15" fill="#334155">Alarm / Action</text>

  <!-- Traits -->
  <text x="225" y="368" text-anchor="middle" font-size="13" fill="#475569">Deterministic &#8226; hand-tuned &#8226; explainable</text>
  <text x="225" y="390" text-anchor="middle" font-size="13" fill="#475569">Struggles with multi-sensor patterns</text>

  <!-- === Edge AI column === -->
  <!-- Sensor -->
  <rect x="565" y="70" width="220" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="675" y="104" text-anchor="middle" font-size="15" fill="#334155">Sensor Reading(s)</text>

  <line x1="675" y1="126" x2="675" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Model -->
  <rect x="555" y="170" width="240" height="64" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="675" y="197" text-anchor="middle" font-size="15" font-weight="600" fill="#0e7490">Quantized TFLite Model</text>
  <text x="675" y="217" text-anchor="middle" font-size="13" fill="#0e7490" font-family="'IBM Plex Mono', monospace">on-device inference</text>

  <line x1="675" y1="234" x2="675" y2="274" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action -->
  <rect x="565" y="278" width="220" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="675" y="312" text-anchor="middle" font-size="15" fill="#334155">Confidence Score &#8594; Action</text>

  <!-- Traits -->
  <text x="675" y="368" text-anchor="middle" font-size="13" fill="#475569">Learns nonlinear, multi-sensor patterns</text>
  <text x="675" y="390" text-anchor="middle" font-size="13" fill="#475569">Needs labeled data &amp; a training pipeline</text>

  <!-- Footer -->
  <text x="450" y="450" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="'IBM Plex Mono', monospace">choose based on signal complexity, safety requirements, and available data</text>
</svg>
